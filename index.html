<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AG Developments</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--red:#A21D23;--wine:#5B0F13;--cream:#F4EEDC;--line:#E0D5B8;--ink:#2A1A18;--green:#1E6B4A}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Readex Pro',Tahoma,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6}
button,input{font:inherit}
bdi{direction:ltr;unicode-bidi:isolate}
.err{padding:40px 20px;text-align:center}
:focus-visible{outline:3px solid var(--wine);outline-offset:2px}

/* admin */
.bar{background:var(--red);color:var(--cream);display:flex;align-items:center;gap:14px;padding:16px 20px}
.bar img{width:52px;height:52px;border-radius:50%}
.bar h1{font-size:20px;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:20px}
.panel{border-bottom:1px solid var(--line);padding:20px 0}
.panel h2{font-size:17px;margin:0 0 14px}
label{display:block;font-size:14px;margin:0 0 4px;color:var(--wine)}
input[type=text],input[type=tel],input[type=url],input[type=password]{width:100%;padding:11px 12px;border:1.5px solid var(--line);background:#FBF8EE;border-radius:10px;margin-bottom:12px;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 12px;color:var(--ink)}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--red);color:var(--cream);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.sm{padding:7px 12px;font-size:14px}
.warn{background:#F8E3C9;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.hint{font-size:13px;color:#6b5a50;margin:-6px 0 12px}
.item{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.item canvas{width:132px;height:132px;flex:none;border-radius:8px}
.item h3{margin:0;font-size:17px}
.item p{margin:0;font-size:14px;color:#6b5a50}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.empty{color:#6b5a50;padding:16px 0}
@media(max-width:520px){.item{flex-direction:column;align-items:flex-start}}
.gate{max-width:340px;margin:18vh auto;padding:20px;text-align:center}
.gate img{width:96px;border-radius:50%;margin-bottom:14px}

/* visitor */
body.v{background:var(--red)}
.top{padding:36px 20px 56px;display:flex;justify-content:center}
.top img{width:116px;height:116px;border-radius:50%;box-shadow:0 0 0 5px var(--cream)}
.sheet{background:var(--cream);min-height:70vh;margin-top:-28px;border-radius:28px 28px 0 0;padding:30px 22px 40px;max-width:520px;margin-inline:auto}
.sheet h1{font-size:30px;line-height:1.25;margin:0 0 6px;color:var(--wine)}
.job{font-size:18px;margin:0}
.co{font-size:15px;color:var(--red);font-weight:600;margin:2px 0 28px}
.b{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 18px;border-radius:14px;text-decoration:none;font-weight:600;font-size:17px;margin-bottom:12px;border:2px solid transparent;cursor:pointer;background:none}
.b small{font-weight:400;font-size:14px;opacity:.9}
.call{background:var(--red);color:var(--cream)}
.wa{background:var(--green);color:#fff}
.save{border-color:var(--red);color:var(--red)}
</style>
</head>

/* ---------- QR ---------- */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function drawQR(url,size){
  const h=document.createElement('div');
  const m=new QRCode(h,{text:url,width:64,height:64,correctLevel:QRCode.CorrectLevel.H})._oQRCode;
  const n=m.getModuleCount(),q=2,cell=size/(n+q*2),o=q*cell,mid=n/2,R=n*0.19;
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');x.fillStyle=CREAM;x.fillRect(0,0,size,size);
  const fin=(r,k)=>(r<7&&k<7)||(r<7&&k>=n-7)||(r>=n-7&&k<7);
  x.fillStyle=RED;
  for(let r=0;r<n;r++)for(let k=0;k<n;k++){
    if(!m.isDark(r,k)||fin(r,k))continue;
    if(Math.hypot(r+.5-mid,k+.5-mid)<R+.9)continue;
    rr(x,o+k*cell+cell*.04,o+r*cell+cell*.04,cell*.92,cell*.92,cell*.3);x.fill();
  }
  [[0,0],[0,n-7],[n-7,0]].forEach(([r,k])=>{
    const X=o+k*cell,Y=o+r*cell;
    x.fillStyle=RED;rr(x,X,Y,7*cell,7*cell,1.9*cell);x.fill();
    x.fillStyle=CREAM;rr(x,X+cell,Y+cell,5*cell,5*cell,1.1*cell);x.fill();
    x.fillStyle=RED;rr(x,X+2*cell,Y+2*cell,3*cell,3*cell,.8*cell);x.fill();
  });
  const cx=size/2,rad=R*cell;
  x.fillStyle=CREAM;x.beginPath();x.arc(cx,cx,rad+cell*.6,0,7);x.fill();
  x.save();x.beginPath();x.arc(cx,cx,rad,0,7);x.clip();x.drawImage(logoImg,cx-rad,cx-rad,rad*2,rad*2);x.restore();
  return c;
}

/* ---------- زائر ---------- */
function visitor(d,host){
  if(!host){document.title=d.n;document.body.className='v'}
  const ph=intl(d.p),wa=intl(d.w||d.p);
  (host||document.body).innerHTML=`<header class="top"><img src="${LOGO}" alt="${esc(d.c)}"></header>
  <main class="sheet"><h1>${esc(d.n)}</h1><p class="job">${esc(d.t)}</p><p class="co">${esc(d.c)}</p>
  <a class="b call" href="tel:+${ph}">اتصال هاتفي <small><bdi>${esc(d.p)}</bdi></small></a>
  <a class="b wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">واتساب <small><bdi>${esc(d.w||d.p)}</bdi></small></a>
  <button class="b save" id="sv">حفظ جهة الاتصال</button></main>`;
  (host||document).querySelector('#sv').onclick=()=>{
    const v=['BEGIN:VCARD','VERSION:3.0','N:;'+d.n+';;;','FN:'+d.n,'ORG:'+d.c,'TITLE:'+d.t,'TEL;TYPE=CELL:+'+ph];
    if(wa!==ph)v.push('TEL;TYPE=WORK:+'+wa);v.push('END:VCARD');
    const blob=new Blob([v.join('\r\n')],{type:'text/vcard'});
    const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=d.n+'.vcf';document.body.appendChild(a);a.click();a.remove()};
    const ua=navigator.userAgent,E=encodeURIComponent;
    if(/Android/i.test(ua)){
      let u='intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;S.name='+E(d.n)+';S.phone='+E('+'+ph)+';S.company='+E(d.c)+';S.job_title='+E(d.t)+';';
      if(wa!==ph)u+='S.secondary_phone='+E('+'+wa)+';';
      location.href=u+'end';
      setTimeout(()=>{if(!document.hidden)dl()},2000);
    }else if(/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)){
      location.href=URL.createObjectURL(blob);
    }else dl();
  };
}

/* ---------- أدمن ---------- */
function gate(){
  document.body.innerHTML=`<div class="gate"><img src="${LOGO}" alt=""><label for="pin">الرقم السري</label><input id="pin" type="text" inputmode="numeric" autocomplete="off" dir="ltr"><button class="btn" type="button" id="go">دخول</button></div>`;
  const pin=document.getElementById('pin');
  const go=()=>{if(norm(pin.value)===norm(PIN)){authed=true;admin()}else{pin.value='';pin.placeholder='الرقم غير صحيح'}};
  document.getElementById('go').onclick=go;
  pin.onkeydown=e=>{if(e.key==='Enter')go()};
}
function admin(){
  if(!authed)return gate();
  const get=(k,f)=>{try{return JSON.parse(LS.get(k))||f}catch(e){return f}};
  let people=get('ag_people',[]);
  const here=location.href.split(/[?#]/)[0];
  let base=LS.get('ag_base')||here;
  let company=LS.get('ag_company')||'AG Developments';
  document.body.className='';
  document.body.innerHTML=`<div class="bar"><img src="${LOGO}" alt=""><h1>بطاقات التواصل</h1></div>
  <div class="wrap">
  ${location.protocol==='file:'?'<div class="warn">الصفحة مفتوحة من ملف على جهازك. ارفعها على استضافة (Netlify أو GitHub Pages) وحط الرابط في الخانة تحت قبل ما تطبع أي QR.</div>':''}
  <section class="panel"><h2>إضافة شخص</h2>
  <div id="f"><div class="row"><div><label for="n">الاسم</label><input id="n" type="text" required></div>
  <div><label for="t">المسمى الوظيفي</label><input id="t" type="text" required></div></div>
  <label for="c">اسم الشركة</label><input id="c" type="text" required value="${esc(company)}">
  <div class="row"><div><label for="p">رقم الهاتف</label><input id="p" type="tel" inputmode="tel" required placeholder="01xxxxxxxxx"></div>
  <div><label for="w">رقم الواتساب</label><input id="w" type="tel" inputmode="tel"></div></div>
  <label class="chk"><input id="same" type="checkbox" checked> رقم الواتساب هو نفس رقم الهاتف</label>
  <button class="btn" type="button" id="add">إضافة وإنشاء QR</button></div></section>
  <section class="panel"><h2>رابط الموقع</h2><input id="base" type="url" dir="ltr" value="${esc(base)}">
  <p class="hint">الرابط اللي هتترفع عليه الصفحة دي. بيتحط جوه كل QR.</p></section>
  <section><div id="list"></div></section></div>`;
  const $=id=>document.getElementById(id);
  const sync=()=>{$('w').disabled=$('same').checked;if($('same').checked)$('w').value=''};
  $('same').onchange=sync;sync();
  $('base').onchange=()=>{base=$('base').value.trim()||here;LS.set('ag_base',base);render()};
  $('add').onclick=()=>{
    if(!$('n').value.trim()||!$('t').value.trim()||!$('c').value.trim()||!$('p').value.trim()){alert('كمّل الاسم والمسمى والشركة ورقم الهاتف');return}
    company=$('c').value.trim();LS.set('ag_company',company);
    people.unshift({id:Date.now(),n:$('n').value.trim(),t:$('t').value.trim(),c:company,p:$('p').value.trim(),w:$('same').checked?'':$('w').value.trim()});
    LS.set('ag_people',JSON.stringify(people));
    $('n').value='';$('t').value='';$('p').value='';$('w').value='';render();
  };
  const urlFor=p=>base+'?c='+enc({n:p.n,t:p.t,c:p.c,p:p.p,w:p.w});
  function render(){
    const L=$('list');L.innerHTML='';
    if(!people.length){L.innerHTML='<p class="empty">لسه مفيش أشخاص. ضيف أول واحد من فوق.</p>';return}
    people.forEach(p=>{
      const it=document.createElement('div');it.className='item';
      let cv;try{cv=drawQR(urlFor(p),400)}catch(e){cv=document.createElement('p');cv.textContent='البيانات طويلة على QR'}
      const info=document.createElement('div');
      info.innerHTML=`<h3>${esc(p.n)}</h3><p>${esc(p.t)} - ${esc(p.c)}</p><div class="acts"></div>`;
      const acts=info.querySelector('.acts');
      const add=(txt,fn,cls)=>{const b=document.createElement('button');b.className='btn sm '+(cls||'');b.textContent=txt;b.onclick=fn;acts.appendChild(b)};
      add('تحميل QR',()=>{const big=drawQR(urlFor(p),1200);big.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='QR-'+p.n+'.png';a.click()})});
      add('معاينة',()=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#A21D23;overflow:auto;z-index:50';const host=document.createElement('div');o.appendChild(host);visitor({n:p.n,t:p.t,c:p.c,p:p.p,w:p.w},host);const x=document.createElement('button');x.className='btn sm';x.style.cssText='position:fixed;top:12px;inset-inline-start:12px;background:#F4EEDC;color:#A21D23;z-index:51';x.textContent='إغلاق المعاينة';x.onclick=()=>o.remove();o.appendChild(x);document.body.appendChild(o)},'ghost');
      add('نسخ الرابط',e=>{navigator.clipboard.writeText(urlFor(p));e.target.textContent='تم النسخ'},'ghost');
      add('حذف',()=>{if(confirm('حذف '+p.n+'؟')){people=people.filter(x=>x.id!==p.id);LS.set('ag_people',JSON.stringify(people));render()}},'ghost');
      it.append(cv,info);L.appendChild(it);
    });
  }
  render();
  logoImg.onload=render;
}

/* ---------- تشغيل ---------- */
const param=new URLSearchParams(location.search).get('c');
if(param){try{visitor(dec(param))}catch(e){document.body.innerHTML='<p class="err">الرابط غير صالح</p>'}}
else admin();
</script>
</body>
</html>
